    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="/assets/css/global.css" rel="stylesheet">
  </head>
  <body>
    <div class="page-shell">
      <div class="page-shell__grain" aria-hidden="true"></div>

      <main class="layout">
        <section class="hero reveal reveal-delay-1">
          <p class="eyebrow">Placeholder imagery for calmer builds</p>
          <h1>place the <span>dude</span></h1>
          <p class="lede">Images with a little Lebowski energy.</p>

          <div class="endpoint-card">
            <p class="endpoint-card__label">Usage</p>
            <a class="endpoint-link" href="/img/320/200">
              <code>https://placethedude.com/img/320/200</code>
            </a>
          </div>
        </section>

        <section class="mosaic reveal reveal-delay-2" aria-label="Sample placeholder images">
          <figure class="frame frame-tall">
            <img src="/img/275/400" alt="Tall placeholder image sample of The Dude">
          </figure>

          <div class="mosaic-stack">
            <figure class="frame frame-top-wide">
              <img src="/img/320/150" alt="Wide placeholder image sample of The Dude">
            </figure>

            <figure class="frame frame-bottom-wide">
              <img src="/img/320/230" alt="Large placeholder image sample of The Dude">
            </figure>
          </div>
        </section>

        <footer class="site-footer reveal reveal-delay-3">
          <p><a href="https://github.com/steve-swanson/placethedude">GitHub</a> — Images © Universal Pictures</p>
        </footer>
      </main>
    </div>
  </body>
